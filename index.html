<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yasin AI - Mobile AI Studio</title>
  <meta name="theme-color" content="#020617">
  <meta name="description" content="Yasin AI - AI writing, YouTube scripts, and translation studio.">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html[lang="ar"] body {
      font-family: 'Cairo', sans-serif;
    }

    button:disabled {
      cursor: not-allowed;
    }

    textarea {
      overflow-wrap: anywhere;
    }

    #responseContent {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900/95 backdrop-blur sticky top-0 z-50 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-slate-950 text-lg shadow-md">
        Y
      </div>

      <div>
        <h1 class="text-lg font-bold text-white leading-tight">
          Yasin <span class="text-emerald-400">AI</span>
        </h1>
        <p id="subtitle" class="text-[10px] text-slate-400">
          Writing & Translation
        </p>
      </div>
    </div>

    <select
      id="langSelect"
      onchange="changeLanguage(this.value)"
      aria-label="Interface language"
      class="bg-slate-800 text-slate-200 text-xs rounded-lg px-2.5 py-2 border border-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-400"
    >
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </header>

  <!-- Main -->
  <main class="flex-grow p-4 max-w-md mx-auto w-full flex flex-col gap-4">

    <!-- API Key -->
    <section class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs flex flex-col gap-2">

      <div class="flex items-center justify-between gap-2 text-slate-300">
        <span id="lblGemini" class="font-semibold text-emerald-400">
          ⚡ Google AI Studio API Key
        </span>

        <a
          href="https://aistudio.google.com/app/apikey"
          target="_blank"
          rel="noopener noreferrer"
          class="text-emerald-400 underline whitespace-nowrap"
        >
          Get Free Key
        </a>
      </div>

      <div class="flex gap-2">
        <input
          id="geminiKey"
          type="password"
          autocomplete="off"
          placeholder="Paste your API key here"
          aria-label="Google AI Studio API key"
          class="min-w-0 flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500"
        >

        <button
          type="button"
          onclick="toggleKeyVisibility()"
          id="keyVisibilityBtn"
          aria-label="Show or hide API key"
          class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300"
        >
          👁️
        </button>
      </div>

      <p id="keyNote" class="text-[10px] text-slate-500 leading-relaxed">
        Without an API key, Demo Mode will be used. Never share your API key.
      </p>
    </section>

    <!-- Tool Tabs -->
    <section class="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-xs font-semibold">

      <button
        type="button"
        onclick="selectTool('social')"
        id="btn-social"
        class="tool-btn py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold"
      >
        Social Post
      </button>

      <button
        type="button"
        onclick="selectTool('youtube')"
        id="btn-youtube"
        class="tool-btn py-3 rounded-xl text-slate-400 hover:text-white"
      >
        YouTube Script
      </button>

      <button
        type="button"
        onclick="selectTool('translate')"
        id="btn-translate"
        class="tool-btn py-3 rounded-xl text-slate-400 hover:text-white"
      >
        Translate
      </button>
    </section>

    <!-- Translation Target -->
    <section
      id="translateTargetBox"
      class="hidden bg-slate-900 p-3 rounded-xl border border-slate-800 items-center justify-between gap-3 text-xs"
    >
      <label id="lblTarget" for="targetLanguage" class="font-medium text-slate-300">
        Translate into:
      </label>

      <select
        id="targetLanguage"
        class="bg-slate-800 text-slate-200 rounded-lg px-3 py-2 border border-slate-700 font-semibold focus:outline-none focus:border-emerald-500"
      >
        <option value="Urdu">Urdu (اردو)</option>
        <option value="Arabic">Arabic (العربية)</option>
        <option value="English">English</option>
      </select>
    </section>

    <!-- Input -->
    <section class="space-y-2">
      <label
        id="inputLabel"
        for="userInput"
        class="block text-xs font-medium text-slate-300"
      >
        Topic or Text:
      </label>

      <textarea
        id="userInput"
        rows="5"
        maxlength="20000"
        placeholder="Write your topic or text here..."
        class="w-full bg-slate-900 text-slate-100 rounded-2xl p-4 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-400 placeholder-slate-600 text-sm resize-y"
      ></textarea>

      <div class="text-right text-[10px] text-slate-500">
        <span id="charCount">0</span>/20000
      </div>
    </section>

    <!-- Error -->
    <div
      id="errorAlert"
      role="alert"
      aria-live="polite"
      class="hidden p-3.5 bg-red-950/80 border border-red-500/50 rounded-xl text-red-200 text-xs flex items-start gap-2 leading-relaxed"
    >
      <span>⚠️</span>
      <div id="errorMessage" class="flex-grow"></div>
    </div>

    <!-- Generate -->
    <button
      id="generateBtn"
      type="button"
      onclick="handleGenerate()"
      class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] transition text-slate-950 font-bold rounded-2xl text-base shadow-xl flex items-center justify-center gap-2"
    >
      <span id="btnText">Generate Response</span>

      <div
        id="spinner"
        class="hidden w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"
      ></div>
    </button>

    <!-- Result -->
    <section
      id="responseContainer"
      aria-live="polite"
      class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl"
    >
      <div class="flex items-center justify-between gap-3 pb-3 mb-3 border-b border-slate-800">

        <span
          id="responseTitle"
          class="text-xs font-bold text-emerald-400 uppercase tracking-wider"
        >
          AI Result
        </span>

        <button
          type="button"
          onclick="copyOutput()"
          id="copyBtn"
          class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700"
        >
          Copy
        </button>
      </div>

      <div
        id="responseContent"
        class="text-sm leading-relaxed text-slate-200"
      ></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="py-4 px-3 text-center text-xs text-slate-600 border-t border-slate-900">
    <span>Yasin AI</span> • <span id="footerText">AI Writing & Translation Studio</span>
  </footer>

  <script>
    "use strict";

    let currentTool = "social";
    let currentLang = "en";
    let isGenerating = false;

    const UI_STRINGS = {
      en: {
        dir: "ltr",
        subtitle: "Writing & Translation",
        social: "Social Post",
        youtube: "YouTube Script",
        translate: "Translate",
        inputLabel: "Topic or Text:",
        placeholderSocial: "Example: Write an engaging Instagram post about productivity...",
        placeholderYT: "Example: Create a 60-second YouTube Shorts script about success...",
        placeholderTrans: "Enter Urdu, Arabic, or English text to translate...",
        generate: "Generate Response",
        generating: "Generating with Yasin AI...",
        lblTarget: "Translate into:",
        output: "AI Result",
        copy: "Copy",
        copied: "Copied!",
        emptyInput: "Please enter your topic or text first.",
        footer: "AI Writing & Translation Studio",
        keyNote: "Without an API key, Demo Mode will be used. Never share your API key.",
        invalidKey: "The API key was rejected. Check your Google AI Studio key and make sure the selected model is available to your account.",
        rateLimit: "The API usage limit has been reached. Please wait and try again later.",
        networkError: "Could not connect to the AI service. Check your internet connection and try again.",
        generalError: "The AI service could not complete your request. Please try again.",
        emptyResponse: "The AI returned an empty response. Please try again.",
        copyError: "Unable to copy automatically. Please select and copy the text manually.",
        demoNotice: "Demo Mode: This is a sample response, not a live AI-generated answer."
      },

      ar: {
        dir: "rtl",
        subtitle: "الكتابة والترجمة",
        social: "منشور اجتماعي",
        youtube: "نص يوتيوب",
        translate: "ترجمة",
        inputLabel: "الموضوع أو النص:",
        placeholderSocial: "مثال: اكتب منشوراً جذاباً عن الإنتاجية...",
        placeholderYT: "مثال: اكتب نص فيديو يوتيوب قصير عن النجاح...",
        placeholderTrans: "أدخل نصاً بالعربية أو الإنجليزية أو الأردية للترجمة...",
        generate: "إنشاء الرد",
        generating: "ياسين AI يعمل الآن...",
        lblTarget: "الترجمة إلى:",
        output: "نتيجة الذكاء الاصطناعي",
        copy: "نسخ",
        copied: "تم النسخ!",
        emptyInput: "يرجى إدخال الموضوع أو النص أولاً.",
        footer: "استوديو الكتابة والترجمة بالذكاء الاصطناعي",
        keyNote: "بدون مفتاح API سيتم استخدام الوضع التجريبي. لا تشارك مفتاحك مع أحد.",
        invalidKey: "تم رفض مفتاح API. تحقق من مفتاح Google AI Studio ومن توفر النموذج لحسابك.",
        rateLimit: "تم بلوغ حد الاستخدام. يرجى الانتظار والمحاولة لاحقاً.",
        networkError: "تعذر الاتصال بخدمة الذكاء الاصطناعي. تحقق من الإنترنت وحاول مجدداً.",
        generalError: "تعذر إكمال الطلب. يرجى المحاولة مرة أخرى.",
        emptyResponse: "لم يُرجع الذكاء الاصطناعي أي نص. يرجى المحاولة مجدداً.",
        copyError: "تعذر النسخ تلقائياً. يرجى تحديد النص ونسخه يدوياً.",
        demoNotice: "الوضع التجريبي: هذه إجابة نموذجية وليست نتيجة مباشرة من الذكاء الاصطناعي."
      }
    };

    function getText(key) {
      return UI_STRINGS[currentLang][key] || UI_STRINGS.en[key] || key;
    }

    function changeLanguage(lang) {
      if (!UI_STRINGS[lang]) {
        lang = "en";
      }

      currentLang = lang;

      const t = UI_STRINGS[currentLang];

      document.documentElement.lang = currentLang;
      document.documentElement.dir = t.dir;

      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("btn-social").textContent = t.social;
      document.getElementById("btn-youtube").textContent = t.youtube;
      document.getElementById("btn-translate").textContent = t.translate;
      document.getElementById("inputLabel").textContent = t.inputLabel;
      document.getElementById("lblTarget").textContent = t.lblTarget;
      document.getElementById("btnText").textContent = t.generate;
      document.getElementById("responseTitle").textContent = t.output;
      document.getElementById("copyBtn").textContent = t.copy;
      document.getElementById("footerText").textContent = t.footer;
      document.getElementById("keyNote").textContent = t.keyNote;

      updatePlaceholder();
      updateDirection();
    }

    function updateDirection() {
      const input = document.getElementById("userInput");
      const output = document.getElementById("responseContent");

      if (currentLang === "ar") {
        input.style.textAlign = "right";
        output.style.textAlign = "right";
      } else {
        input.style.textAlign = "left";
        output.style.textAlign = "left";
      }
    }

    function selectTool(tool) {
      if (!["social", "youtube", "translate"].includes(tool)) {
        return;
      }

      currentTool = tool;

      const tools = ["social", "youtube", "translate"];

      tools.forEach(function(name) {
        const btn = document.getElementById("btn-" + name);

        if (name === tool) {
          btn.className =
            "tool-btn py-3 rounded-xl transition-all bg-emerald-500 text-slate-950 font-bold shadow-md";
        } else {
          btn.className =
            "tool-btn py-3 rounded-xl transition-all text-slate-400 hover:text-white";
        }
      });

      const targetBox = document.getElementById("translateTargetBox");

      if (tool === "translate") {
        targetBox.classList.remove("hidden");
        targetBox.classList.add("flex");
      } else {
        targetBox.classList.add("hidden");
        targetBox.classList.remove("flex");
      }

      updatePlaceholder();
      clearError();
    }

    function updatePlaceholder() {
      const input = document.getElementById("userInput");
      const t = UI_STRINGS[currentLang];

      if (currentTool === "social") {
        input.placeholder = t.placeholderSocial;
      } else if (currentTool === "youtube") {
        input.placeholder = t.placeholderYT;
      } else {
        input.placeholder = t.placeholderTrans;
      }
    }

    function toggleKeyVisibility() {
      const input = document.getElementById("geminiKey");

      input.type = input.type === "password" ? "text" : "password";
    }

    function showError(message) {
      document.getElementById("errorMessage").textContent = message;
      document.getElementById("errorAlert").classList.remove("hidden");
    }

    function clearError() {
      document.getElementById("errorAlert").classList.add("hidden");
      document.getElementById("errorMessage").textContent = "";
    }

    function setLoading(loading) {
      isGenerating = loading;

      const btn = document.getElementById("generateBtn");
      const btnText = document.getElementById("btnText");
      const spinner = document.getElementById("spinner");

      btn.disabled = loading;
      btn.classList.toggle("opacity-75", loading);

      btnText.textContent = loading
        ? getText("generating")
        : getText("generate");

      spinner.classList.toggle("hidden", !loading);
    }

    async function handleGenerate() {
      if (isGenerating) {
        return;
      }

      clearError();

      const input = document.getElementById("userInput").value.trim();
      const key = document.getElementById("geminiKey").value.trim();
      const targetLang = document.getElementById("targetLanguage").value;

      if (!input) {
        showError(getText("emptyInput"));
        document.getElementById("userInput").focus();
        return;
      }

      const responseContainer = document.getElementById("responseContainer");
      const responseContent = document.getElementById("responseContent");

      setLoading(true);

      responseContent.textContent = "";
      responseContainer.classList.add("hidden");

      try {
        let result;

        if (!key) {
          await new Promise(resolve => setTimeout(resolve, 600));

          result = getOfflineSimulationResponse(
            currentTool,
            input,
            targetLang,
            currentLang
          );

          result += "\n\n" + getText("demoNotice");
        } else {
          result = await callGeminiAPI(
            key,
            currentTool,
            input,
            targetLang,
            currentLang
          );
        }

        if (!result || !result.trim()) {
          throw new Error(getText("emptyResponse"));
        }

        responseContent.textContent = result;
        responseContainer.classList.remove("hidden");

        responseContainer.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      } catch (error) {
        console.error("Yasin AI error:", error);

        showError(
          error.message || getText("generalError")
        );

      } finally {
        setLoading(false);
      }
    }

    async function callGeminiAPI(apiKey, tool, text, targetLang, uiLang) {
      const langName = uiLang === "ar" ? "Arabic" : "English";

      let systemInstruction = "";

      if (tool === "social") {
        systemInstruction =
          "You are Yasin AI, a professional social media content creator. " +
          "Create an engaging, original social media post based on the user's topic. " +
          "Use suitable emojis and relevant hashtags when appropriate. " +
          "Write the final answer in " + langName + ".";
      }

      else if (tool === "youtube") {
        systemInstruction =
          "You are Yasin AI, an expert YouTube scriptwriter. " +
          "Write a useful, engaging script based on the user's topic. " +
          "Include a strong Hook, Introduction, Main Points, and Call to Action. " +
          "Write the final answer in " + langName + ".";
      }

      else if (tool === "translate") {
        systemInstruction =
          "You are Yasin AI, a professional translator. " +
          "Translate the user's text accurately into " + targetLang + ". " +
          "Preserve the original meaning and tone. " +
          "Return only the translated text without explanations.";
      }

      const endpoint =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent";

      const payload = {
        systemInstruction: {
          parts: [
            {
              text: systemInstruction
            }
          ]
        },

        contents: [
          {
            role: "user",
            parts: [
              {
                text: text
              }
            ]
          }
        ],

        generationConfig: {
          temperature: 0.7,
          maxOutputTokens: 4096
        }
      };

      let response;

      try {
        response = await fetch(endpoint, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },

          body: JSON.stringify(payload)
        });
      } catch (error) {
        throw new Error(getText("networkError"));
      }

      let data;

      try {
        data = await response.json();
      } catch (error) {
        throw new Error(getText("generalError"));
      }

      if (!response.ok) {
        const apiMessage =
          data?.error?.message || "";

        if (response.status === 400 || response.status === 401 || response.status === 403) {
          throw new Error(
            getText("invalidKey") +
            (apiMessage ? " Details: " + apiMessage : "")
          );
        }

        if (response.status === 429) {
          throw new Error(getText("rateLimit"));
        }

        if (response.status === 404) {
          throw new Error(
            "The selected Gemini model is unavailable. Check the current model name and your API access."
          );
        }

        throw new Error(
          apiMessage
            ? "Google AI Studio: " + apiMessage
            : getText("generalError")
        );
      }

      const result = data?.candidates?.[0]?.content?.parts
        ?.map(part => part.text || "")
        .join("")
        .trim();

      if (!result) {
        const finishReason = data?.candidates?.[0]?.finishReason;

        if (finishReason === "SAFETY") {
          throw new Error(
            "The request could not be completed because it triggered the AI safety filter. Try changing your text."
          );
        }

        throw new Error(getText("emptyResponse"));
      }

      return result;
    }

    function getOfflineSimulationResponse(tool, prompt, targetLang, lang) {
      if (tool === "translate") {
        if (targetLang === "Urdu") {
          return (
            "نمونہ ترجمہ — یاسین AI\n\n" +
            "آپ کا دیا ہوا متن:\n" +
            prompt +
            "\n\nDemo Mode میں حقیقی ترجمہ دستیاب نہیں۔ " +
            "حقیقی ترجمے کے لیے اپنی Google AI Studio API Key درج کریں۔"
          );
        }

        if (targetLang === "Arabic") {
          return (
            "ترجمة تجريبية — Yasin AI\n\n" +
            "النص الذي أدخلته:\n" +
            prompt +
            "\n\nالترجمة الحقيقية غير متاحة في الوضع التجريبي. " +
            "أدخل مفتاح Google AI Studio للحصول على ترجمة فعلية."
          );
        }

        return (
          "Demo Translation — Yasin AI\n\n" +
          "Your input:\n" +
          prompt +
          "\n\nLive translation requires a Google AI Studio API key."
        );
      }

      if (tool === "youtube") {
        if (lang === "ar") {
          return (
            "🎬 نص فيديو يوتيوب — Yasin AI\n\n" +
            "[المقدمة المشوقة]\n" +
            "هل تريد معرفة المزيد عن: " + prompt + "؟\n\n" +
            "[المقدمة]\n" +
            "أهلاً بكم! سنتحدث اليوم عن هذا الموضوع بطريقة بسيطة ومفيدة.\n\n" +
            "[النقاط الرئيسية]\n" +
            "1. افهم الأساسيات.\n" +
            "2. ركز على أهم المعلومات.\n" +
            "3. طبّق ما تعلمته باستمرار.\n\n" +
            "[الدعوة للتفاعل]\n" +
            "إذا أعجبك الفيديو، اضغط إعجاب واشترك في القناة!"
          );
        }

        return (
          "🎬 YouTube Script — Yasin AI\n\n" +
          "[HOOK]\n" +
          "Want to learn something useful about " + prompt + "?\n\n" +
          "[INTRODUCTION]\n" +
          "Welcome! Today, we are exploring this topic in a simple and practical way.\n\n" +
          "[MAIN POINTS]\n" +
          "1. Understand the basics.\n" +
          "2. Focus on the most important lessons.\n" +
          "3. Apply what you learn consistently.\n\n" +
          "[CALL TO ACTION]\n" +
          "Like this video and subscribe for more useful content!"
        );
      }

      if (lang === "ar") {
        return (
          "✨ منشور تجريبي — Yasin AI\n\n" +
          "هل ترغب في معرفة المزيد عن " + prompt + "؟ 🚀\n\n" +
          "ابدأ بخطوة صغيرة، واستمر في التعلم والتطور كل يوم.\n\n" +
          "ما رأيك؟ شاركنا رأيك في التعليقات! 👇\n\n" +
          "#ياسين_AI #التطوير_الذاتي #الإبداع"
        );
      }

      return (
        "✨ Social Media Post — Yasin AI\n\n" +
        "Ready to explore " + prompt + "? 🚀\n\n" +
        "Small steps, consistent effort, and continuous learning can make a real difference.\n\n" +
        "What do you think? Share your thoughts in the comments! 👇\n\n" +
        "#YasinAI #Creativity #GrowthMindset"
      );
    }

    async function copyOutput() {
      const text = document.getElementById("responseContent").innerText;

      if (!text) {
        return;
      }

      const copyBtn = document.getElementById("copyBtn");

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement("textarea");

          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.opacity = "0";

          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();

          const success = document.execCommand("copy");

          textArea.remove();

          if (!success) {
            throw new Error("Copy failed");
          }
        }

        copyBtn.textContent = getText("copied");

        setTimeout(function() {
          copyBtn.textContent = getText("copy");
        }, 2000);

      } catch (error) {
        showError(getText("copyError"));
      }
    }

    document.getElementById("userInput").addEventListener("input", function() {
      document.getElementById("charCount").textContent =
        this.value.length;
    });

    // Initialize the app
    changeLanguage("en");
    selectTool("social");
  </script>

</body>
</html>
